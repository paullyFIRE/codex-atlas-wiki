<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b160a"/>
      <stop offset="50%" stop-color="#432b1d"/>
      <stop offset="100%" stop-color="#2b160a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ffba20"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Epic grid dots -->
  <g fill="#ffb800" opacity="0.08">
    <circle cx="20" cy="20" r="2"/><circle cx="60" cy="20" r="2"/><circle cx="100" cy="20" r="2"/>
    <circle cx="140" cy="20" r="2"/><circle cx="180" cy="20" r="2"/><circle cx="220" cy="20" r="2"/>
    <circle cx="260" cy="20" r="2"/><circle cx="300" cy="20" r="2"/><circle cx="340" cy="20" r="2"/>
    <circle cx="380" cy="20" r="2"/><circle cx="420" cy="20" r="2"/><circle cx="460" cy="20" r="2"/>
    <circle cx="20" cy="60" r="2"/><circle cx="60" cy="60" r="2"/><circle cx="100" cy="60" r="2"/>
    <circle cx="140" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="220" cy="60" r="2"/>
    <circle cx="260" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="340" cy="60" r="2"/>
    <circle cx="380" cy="60" r="2"/><circle cx="420" cy="60" r="2"/><circle cx="460" cy="60" r="2"/>
  </g>
  <!-- Shield icon -->
  <g transform="translate(600, 200)">
    <path d="M0-80 L80-40 L80 40 L0 80 L-80 40 L-80-40 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <path d="M0-50 L50-25 L50 25 L0 50 L-50 25 L-50-25 Z" fill="url(#gold)" opacity="0.15"/>
    <circle cx="0" cy="0" r="20" fill="url(#gold)"/>
  </g>
  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-size="56" font-weight="800" fill="#ffb800" letter-spacing="-1">WAR INC: RISING WIKI</text>
  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="500" fill="#ffeae0">Hero Stats · Strategy Guides · Tier Lists · Database</text>
  <!-- Features -->
  <g transform="translate(0, 460)">
    <rect x="200" y="0" width="800" height="1" fill="#ffb800" opacity="0.3"/>
    <g transform="translate(300, 20)">
      <circle cx="0" cy="0" r="4" fill="#78dc41"/>
      <text x="15" y="5" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="16" fill="#78dc41" font-weight="700">95 Heroes</text>
    </g>
    <g transform="translate(460, 20)">
      <circle cx="0" cy="0" r="4" fill="#ffb800"/>
      <text x="15" y="5" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="16" fill="#ffb800" font-weight="700">36 Buildings</text>
    </g>
    <g transform="translate(640, 20)">
      <circle cx="0" cy="0" r="4" fill="#a336ff"/>
      <text x="15" y="5" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="16" fill="#a336ff" font-weight="700">20 Bosses</text>
    </g>
    <g transform="translate(820, 20)">
      <circle cx="0" cy="0" r="4" fill="#ffb800"/>
      <text x="15" y="5" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="16" fill="#ffb800" font-weight="700">1,159 Pages</text>
    </g>
  </g>
  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" fill="#837560">Part of Codex Atlas · Unofficial Fan Site</text>
</svg>
