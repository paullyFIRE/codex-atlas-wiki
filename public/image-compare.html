<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Comparison — Official vs APK</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, system-ui, sans-serif; background: #0d0d0d; color: #e0d5c1; padding: 2rem; }
h1 { font-family: Cinzel, serif; color: #d4a848; margin-bottom: .5rem; }
p { color: #8a7e6b; margin-bottom: 2rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
.card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
.card-header { padding: .75rem 1rem; background: #222; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
.card-header h2 { font-size: .9rem; font-weight: 600; }
.badge { font-size: .7rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.badge-upgraded { background: #2d6a2d; color: #8fda8f; }
.badge-apk { background: #6a4d2d; color: #daa88f; }
.comparison { display: grid; grid-template-columns: 1fr 1fr; }
.comparison > div { position: relative; }
.comparison img { width: 100%; height: 260px; object-fit: contain; display: block; background: #111; }
.label { position: absolute; top: 6px; left: 6px; font-size: .65rem; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
.label-official { background: #1a4a1a; color: #8fda8f; }
.label-apk { background: #4a2a1a; color: #daa88f; }
.file-size { font-size: .7rem; color: #8a7e6b; text-align: center; padding: 4px; background: #151515; }
.summary { display: flex; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap; }
.stat { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1rem 1.5rem; }
.stat-value { font-size: 1.5rem; font-weight: 700; color: #d4a848; }
.stat-label { font-size: .8rem; color: #8a7e6b; }
</style>
</head>
<body>

<h1>Image Comparison</h1>
<p>Official site portraits (scraped) vs APK-extracted textures — 21 mythic heroes.</p>

<div class="summary" id="stats"></div>
<div class="grid" id="grid"></div>

<script>
const HEROES = [
  { id: 'mythic1', apk: '637', name: 'Gryphon Knight' },
  { id: 'mythic2', apk: '638', name: 'Geomancer' },
  { id: 'mythic3', apk: '704', name: 'Storm Maiden' },
  { id: 'mythic4', apk: '706', name: 'Starlight Apostle' },
  { id: 'mythic5', apk: '739', name: 'Fury Cannoneer' },
  { id: 'mythic6', apk: '744', name: 'Flame Duelist' },
  { id: 'mythic7', apk: '749', name: 'The Knight King' },
  { id: 'mythic8', apk: '846', name: 'Blazeking' },
  { id: 'mythic9', apk: '845', name: 'Tide Lord' },
  { id: 'mythic10', apk: '703', name: 'Frost Queen' },
  { id: 'mythic11', apk: '708', name: 'Darkmoon Queen' },
  { id: 'mythic12', apk: '734', name: 'Nine-Tailed Fox' },
  { id: 'mythic13', apk: '762', name: 'Radiant Warrior' },
  { id: 'mythic14', apk: '711', name: 'Bone Marksman' },
  { id: 'mythic15', apk: '735', name: 'Woodland Guardian' },
  { id: 'mythic17', apk: '847', name: 'Red Blade' },
  { id: 'mythic18', apk: '736', name: 'Melody Weaver' },
  { id: 'mythic19', apk: '738', name: 'Ripple Wizard' },
  { id: 'mythic20', apk: '740', name: 'Firepower Vanguard' },
  { id: 'mythic21', apk: '742', name: 'Jungle Ranger' },
  { id: 'mythic22', apk: '743', name: 'Barbarian Tyrant' },
];

function fmt(n) {
  return n >= 1024 ? (n / 1024).toFixed(1) + ' MB' : n + ' KB';
}

async function load() {
  const grid = document.getElementById('grid');
  let totalOfficial = 0, totalApk = 0;
  let countOfficial = 0, countApk = 0;

  const cards = await Promise.all(HEROES.map(async (h) => {
    const officialUrl = `/images/official-site/${h.id}.png`;
    const apkUrl = `/images/heroes/${h.apk}.png`;

    const oResp = await fetch(officialUrl, { method: 'HEAD' });
    const aResp = await fetch(apkUrl, { method: 'HEAD' });
    const oSize = parseInt(oResp.headers.get('content-length') || '0');
    const aSize = parseInt(aResp.headers.get('content-length') || '0');

    totalOfficial += oSize;
    totalApk += aSize;
    if (oSize > aSize) countOfficial++;
    else if (aSize > 0) countApk++;

    const ratio = aSize > 0 ? (oSize / aSize).toFixed(1) : 'N/A';

    return `
      <div class="card">
        <div class="card-header">
          <h2>${h.name}</h2>
          <span class="badge badge-upgraded">${ratio}x larger</span>
        </div>
        <div class="comparison">
          <div>
            <img src="${officialUrl}" alt="${h.name} official" loading="lazy">
            <span class="label label-official">Official (${fmt(oSize)})</span>
          </div>
          <div>
            <img src="${apkUrl}" alt="${h.name} APK" loading="lazy">
            <span class="label label-apk">APK (${fmt(aSize)})</span>
          </div>
        </div>
      </div>
    `;
  }));

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-value">${HEROES.length}</div><div class="stat-label">Heroes Compared</div></div>
    <div class="stat"><div class="stat-value">${fmt(totalOfficial)}</div><div class="stat-label">Official Total Size</div></div>
    <div class="stat"><div class="stat-value">${fmt(totalApk)}</div><div class="stat-label">APK Total Size</div></div>
    <div class="stat"><div class="stat-value">${(totalOfficial / totalApk).toFixed(1)}x</div><div class="stat-label">Size Ratio</div></div>
  `;
  grid.innerHTML = cards.join('');
}

load();
</script>
</body>
</html>
