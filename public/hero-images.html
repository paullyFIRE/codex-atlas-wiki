<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Image Review — War Inc: Rising Wiki</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, system-ui, sans-serif; background: #0d0d0d; color: #e0d5c1; padding: 2rem; }
h1 { font-family: Cinzel, serif; color: #d4a848; margin-bottom: .25rem; }
p { color: #8a7e6b; margin-bottom: 1.5rem; }
.tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.tab { padding: .5rem 1rem; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #e0d5c1; cursor: pointer; font-size: .85rem; }
.tab:hover { border-color: #d4a848; }
.tab.active { background: #d4a848; color: #0d0d0d; border-color: #d4a848; font-weight: 600; }
.tab .count { opacity: .7; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
.card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; display: none; }
.card.visible { display: block; }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #111; }
.card-body { padding: .5rem .75rem; }
.card-body h3 { font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-body .meta { font-size: .7rem; color: #8a7e6b; display: flex; justify-content: space-between; margin-top: 2px; }
.badge { font-size: .6rem; padding: 1px 6px; border-radius: 3px; font-weight: 600; text-transform: uppercase; }
.badge-high { background: #1a4a1a; color: #8fda8f; }
.badge-medium { background: #4a4a1a; color: #dada8f; }
.badge-low { background: #4a1a1a; color: #da8f8f; }
.section-title { font-size: .85rem; color: #8a7e6b; margin-bottom: 1rem; padding-bottom: .5rem; border-bottom: 1px solid #222; grid-column: 1 / -1; }
.official-star { color: #d4a848; margin-left: 2px; }
</style>
</head>
<body>

<h1>Hero Portraits</h1>
<p><span class="official-star">★</span> = official site (1024×1536). No star = battleunit FBX render (512×512, dark green bg). Missing = no texture asset in extracted APK.</p>

<div class="tabs" id="tabs">
  <button class="tab active" data-filter="all">All <span class="count" id="count-all"></span></button>
  <button class="tab" data-filter="high">★ Official <span class="count" id="count-high"></span></button>
  <button class="tab" data-filter="missing">❌ Missing <span class="count" id="count-missing"></span></button>
</div>

<div class="grid" id="grid"></div>

<script>
fetch('/hero-images.json')
  .then(r => r.json())
  .then(data => {
    const { heroes, counts, missing } = data;
    document.getElementById('count-all').textContent = counts.total;
    document.getElementById('count-high').textContent = counts.high;
    document.getElementById('count-medium').textContent = counts.medium;
    document.getElementById('count-missing').textContent = missing ? missing.length : (95 - counts.total);

    const grid = document.getElementById('grid');
    let currentFilter = 'all';

    function render(filter) {
      currentFilter = filter;
      let html = '';
      
      if (filter === 'all') {
        html += `<div class="section-title">★ Official Site Portrait (${heroes.length})</div>`;
        html += heroes.map(h => card(h)).join('');
      } else if (filter === 'missing') {
        html += `<div class="section-title">No Portrait Available (${missing.length})</div>`;
        html += `<p style="color:#8a7e6b;grid-column:1/-1;padding:1rem;">These heroes have no usable texture in the extracted APK. The game stores character art as Spine skeletal animations, not standalone portraits. Options: screenshot via BlueStacks automation, Spine frame extraction, or wait for a newer APK.</p>`;
        if (missing && missing.length) {
          html += missing.map(n => `
            <div class="card visible" style="opacity:0.5;">
              <div style="width:100%;aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center;color:#555;font-size:3rem;">?</div>
              <div class="card-body">
                <h3>${n}</h3>
                <div class="meta"><span class="badge badge-low">missing</span></div>
              </div>
            </div>
          `).join('');
        }
      } else {
        html = heroes.filter(h => h.conf === filter).map(h => card(h)).join('');
      }
      grid.innerHTML = html;
      
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
    }

    function card(h) {
      const slugLink = h.slug ? `/heroes/${h.slug}/` : '#';
      return `
        <div class="card visible">
          <a href="${slugLink}" target="_blank">
            <img src="${h.path}" alt="${h.name}" loading="lazy">
          </a>
          <div class="card-body">
            <h3 title="${h.name}">${h.name} <span class="official-star">★</span></h3>
            <div class="meta">
              <span>${h.w}×${h.h} · ${h.size}KB</span>
              <span class="badge badge-high">Official</span>
            </div>
          </div>
        </div>
      `;
    }

    document.getElementById('tabs').addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (tab) render(tab.dataset.filter);
    });

    render('all');
  });
</script>
</body>
</html>
